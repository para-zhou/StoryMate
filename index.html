<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JC StoryMate</title>
  <style>
    :root { color-scheme: light; font-family: "Trebuchet MS", Verdana, sans-serif; color: #55351f; background: #ead5af; font-size: 16px; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .4; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid #bf7e27; outline-offset: 4px; }
    .page { max-width: 1180px; padding: 36px 32px 34px; margin: auto; }
    header { margin-bottom: 22px; }
    h1 { font: bold clamp(1.65rem, 4vw, 2.3rem) "Courier New", monospace; letter-spacing: .04em; margin: 0; color: #693c22; text-shadow: 2px 2px #fff1cb; }
    h2 { font-size: 1.125rem; margin: 0; }
    .view-tabs { display: flex; gap: 12px; border-bottom: 3px solid #a86e3f; margin-bottom: 24px; }
    .view-tab { border: 2px solid transparent; border-bottom: 0; padding: 9px 19px; background: transparent; color: #805631; }
    .view-tab[aria-selected="true"] { background: #ffe6ad; border-color: #a86e3f; color: #59351f; box-shadow: inset 0 3px #fff2d0; font-weight: 700; }
    .card { background: #ffe6ad; border: 3px solid #8a532d; border-radius: 3px; box-shadow: inset 0 0 0 3px #f1c778, 0 4px 0 #b4844f; overflow: hidden; }
    .chat { max-width: 780px; margin: 0 auto; }
    .chat-heading { display: flex; justify-content: space-between; align-items: center; padding: 17px 23px; border-bottom: 2px solid #d4a762; }
    .chat-log { height: min(50vh, 440px); min-height: 280px; overflow-y: auto; padding: 24px; scrollbar-color: #b8874e #f7dba4; }
    .chat-greeting { color: #805735; line-height: 1.7; margin: 0; }
    .chat-turn { max-width: 87%; margin-bottom: 20px; }
    .chat-turn.user { margin-left: auto; }
    .speaker { font-size: .875rem; font-weight: 700; color: #8a5d38; margin: 0 0 7px; }
    .chat-turn .speaker { margin-bottom: 5px; }
    .bubble { padding: 12px 15px; border: 1px solid #cfab70; border-radius: 3px; line-height: 1.65; overflow-wrap: anywhere; margin: 0 0 20px; }
    .bubble.user { background: #f5d38f; }
    .bubble.eliza { background: #fff3d4; color: #53371f; }
    .bubble.pending { color: #967449; background: #fbe4b2; font-size: .875rem; }
    .chat-turn .bubble { margin-bottom: 0; }
    .message-explain { display: block; margin: 4px 0 0; padding: 4px 0; }
    .chat-form { border-top: 2px solid #d4a762; padding: 18px 23px 21px; }
    .chat-compose { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
    label { display: block; font-size: .875rem; color: #765030; margin-bottom: 8px; }
    input, textarea { width: 100%; background: #fff5dc; border: 2px solid #b48750; border-radius: 2px; padding: 11px 12px; color: #51371f; box-shadow: inset 1px 2px #e7c995; }
    input::placeholder, textarea::placeholder { color: #98764e; }
    textarea { resize: vertical; min-height: 75px; line-height: 1.6; }
    .primary, .secondary { border: 2px solid #84502c; border-radius: 2px; padding: 10px 15px; box-shadow: inset 0 2px #ffffff50, 0 2px #a47442; }
    .primary { background: #b76b35; color: #fff4d8; font-weight: 700; }
    .primary:hover { background: #a85b2c; }
    .secondary { background: #f8d18c; color: #654020; }
    .secondary:hover { background: #efc273; }
    form .primary { width: 100%; margin-top: 12px; }
    .chat-form .primary { width: auto; margin: 0; }
    .text-button { background: none; border: 0; color: #8b5b2f; font-size: .875rem; padding: 10px 4px; }
    .text-button:hover { color: #59341a; text-decoration: underline; }
    .status { font-size: .875rem; color: #86613b; line-height: 1.5; margin: 10px 0 17px; }
    .status.error { color: #a13d2b; }
    .status:empty { display: none; }
    .layout { display: grid; grid-template-columns: minmax(280px, .78fr) minmax(0, 1.6fr); gap: 20px; align-items: stretch; }
    .left { padding: 23px; }
    .left h2 { margin-bottom: 20px; }
    .examples { display: flex; flex-wrap: wrap; gap: 7px; margin: 20px 0 24px; }
    .example { background: #fff0c8; color: #80522c; border: 1px solid #bc9056; border-radius: 2px; padding: 7px 9px; font-size: .875rem; }
    .example:hover { background: #f8d596; }
    .dialogue { border-top: 1px solid #d4ad73; padding-top: 20px; }
    .machine { display: flex; flex-direction: column; }
    .machine-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 22px 23px 18px; }
    .step-count { font-size: .875rem; font-variant-numeric: tabular-nums; color: #93693e; }
    .steps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding: 0 17px 18px; gap: 5px; }
    .step { background: #f8d999; border: 1px solid #c49656; border-radius: 2px; color: #916a3b; padding: 9px 2px; font-size: .875rem; }
    .step[aria-current="step"] { background: #b76b35; color: #fff4d8; border-color: #84502c; font-weight: 700; }
    .step.visited:not([aria-current="step"]) { background: #e8c381; color: #79512c; }
    .screen { margin: 0 23px; background: #fff2cf; color: #573c25; border: 2px solid #ceac70; border-radius: 2px; padding: 23px; min-height: 300px; flex: 1; }
    .screen h3 { font-size: 1.2rem; line-height: 1.5; margin: 0 0 10px; }
    .explanation { color: #8b6a43; line-height: 1.7; margin: 0 0 19px; font-size: .9375rem; }
    .code { font-size: 1rem; line-height: 1.9; overflow-wrap: anywhere; white-space: pre-wrap; margin: 0; }
    .code-label { color: #947044; font-size: .875rem; margin: 14px 0 5px; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip { background: #fff8e4; border: 1px solid #d2b17c; color: #85623b; border-radius: 2px; padding: 5px 10px; line-height: 1.65; }
    .chip.selected { background: #f3cd80; border-color: #ba8740; color: #6c431d; }
    .chip.part { background: #eaf0c6; border-color: #adbb75; color: #65713a; }
    .screen mark { color: #785022; background: #f1d795; border-radius: 2px; padding: 2px 5px; }
    .detail { border-top: 1px solid #dcc18c; margin-top: 18px; padding-top: 14px; color: #8b6a43; font-size: .875rem; line-height: 1.7; }
    .nav { display: flex; gap: 9px; padding: 20px 23px 24px; align-items: center; }
    .nav .text-button { margin-left: auto; }
    .character-frame { position: relative; max-width: 780px; margin: 68px auto 0; }
    .rules-frame { position: relative; margin-top: 68px; }
    .parade-track { --sprite-size: clamp(28px, 8vw, 56px); --party-width: calc(var(--sprite-size) * 6.25 + 36px); position: absolute; top: -62px; left: 10px; right: 10px; width: calc(100% - 20px); height: 66px; padding: 0; border: 0; background: none; z-index: 2; cursor: pointer; }
    .parade-party { position: absolute; bottom: 0; left: 0; width: var(--party-width); display: flex; align-items: end; gap: 6px; animation: stroll 20s linear infinite; }
    .walker { display: block; width: var(--sprite-size); height: var(--sprite-size); flex: none; animation: face-direction 20s step-end infinite; }
    .walker img { display: block; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; transform-origin: 50% 90%; animation: little-steps .6s steps(2, end) infinite; animation-delay: var(--hop-delay, 0s); }
    .walker:nth-child(2) { --hop-delay: -.15s; }
    .walker:nth-child(3) { --hop-delay: -.3s; }
    .walker:nth-child(4) { --hop-delay: -.45s; }
    .walker:nth-child(5) { --hop-delay: -.2s; }
    .walker:nth-child(6) { --hop-delay: -.35s; }
    .walker:nth-child(7) { --hop-delay: -.5s; }
    .walker.small { width: calc(var(--sprite-size) * .75); height: calc(var(--sprite-size) * .75); }
    .parade-track.is-paused .parade-party, .parade-track.is-paused .walker, .parade-track.is-paused img { animation-play-state: paused; }
    @keyframes stroll { 0%, 100% { left: 0; } 47%, 50% { left: calc(100% - var(--party-width)); } 97% { left: 0; } }
    @keyframes face-direction { 0% { transform: scaleX(1); } 50% { transform: scaleX(-1); } 100% { transform: scaleX(1); } }
    @keyframes little-steps { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-3px) rotate(2deg); } }
    @media (prefers-reduced-motion: reduce) { .parade-party, .walker, .walker img { animation: none; } }
    .editor { padding: 24px; }
    .editor-heading, .editor-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .editor-heading { justify-content: space-between; }
    .editor-note { color: #87623c; font-size: .875rem; line-height: 1.7; margin: 15px 0 20px; }
    .word-groups { color: #87623c; font-size: .875rem; line-height: 1.7; margin: -8px 0 18px; }
    .word-groups summary { cursor: pointer; }
    .word-groups p { margin: 8px 0 0; }
    #keyword-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
    .keyword-group { min-width: 0; margin: 0; border: 2px solid #c59b5e; border-radius: 2px; padding: 14px; background: #fff0c9; }
    .keyword-fields { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; background: #f3ce86; border: 1px solid #d7ae64; padding: 12px; }
    .keyword-fields label { color: #80501f; font-weight: 700; }
    .keyword-fields .text-button { padding: 0; font-size: .8125rem; }
    .pattern-fields { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.3fr); gap: 10px; margin-top: 12px; align-items: start; }
    .condition-column { background: #fff7df; border: 1px solid #dbc38e; padding: 12px; }
    .reply-column { background: #e7edc4; border: 1px solid #bdc68c; padding: 12px; }
    .condition-column label { color: #8a682d; font-weight: 700; }
    .reply-column label { color: #657239; font-weight: 700; }
    .editor input, .editor textarea { font-size: .9375rem; padding: 9px 10px; background: #fffaea; }
    .pattern-fields .text-button { grid-column: 1 / -1; margin: 0; padding: 0; justify-self: end; font-size: .8125rem; }
    .rule-footer { display: flex; align-items: start; justify-content: space-between; gap: 10px; margin-top: 10px; }
    .rule-footer > .text-button { padding: 4px 0; }
    .priority-options { color: #997448; font-size: .875rem; }
    .priority-options summary { padding: 4px 0; cursor: pointer; }
    .priority-options input { width: 90px; margin-top: 5px; }
    .editor .status { margin-bottom: 0; }
    .fallback-editor { max-width: 680px; padding: 15px; background: #f7dca5; border: 1px solid #c9a36a; margin: 20px 0; }
    .fallback-editor textarea { min-height: 75px; }
    .editor-actions .text-button { margin-left: auto; }
    .walkthrough { margin-top: 25px; }
    .walkthrough > summary { cursor: pointer; font-weight: 700; padding: 20px 23px; }
    .walkthrough .layout { padding: 0 20px 20px; }
    @media (max-width: 1000px) { #keyword-groups { grid-template-columns: 1fr; } }
    @media (max-width: 850px) { .page { padding: 25px 18px; } .layout { grid-template-columns: 1fr; } .left { padding: 22px; } .examples { margin-bottom: 18px; } .screen { min-height: 280px; } }
    @media (max-width: 650px) { .pattern-fields { grid-template-columns: 1fr; } .editor { padding: 18px; } .walkthrough .layout { padding: 0 12px 12px; } }
    @media (max-width: 420px) { .parade-track { --sprite-size: clamp(28px, 8vw, 36px); top: -42px; height: 46px; } .character-frame, .rules-frame { margin-top: 48px; } .steps { padding: 0 12px 18px; gap: 3px; } .step { font-size: .8125rem; } .screen { margin: 0 14px; padding: 19px; } .machine-heading { padding-left: 20px; padding-right: 20px; } .nav { padding: 18px 14px; gap: 7px; flex-wrap: wrap; } }
    select { width: 100%; font: inherit; appearance: none; border: 2px solid #b48750; border-radius: 2px; padding: 10px 36px 10px 12px; background: #fff5dc; color: #51371f; box-shadow: inset 1px 2px #e7c995; }
    select:focus-visible { outline: 3px solid #bf7e27; outline-offset: 4px; }
    .select-wrap { position: relative; }
    .select-wrap:after { content: ""; position: absolute; right: 14px; top: calc(50% - 5px); width: 8px; height: 8px; border-right: 2px solid #84502c; border-bottom: 2px solid #84502c; transform: rotate(45deg); pointer-events: none; }
    .studio-grid { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); gap: 23px; align-items: start; }
    .script-card, .trace-card { padding: 23px; }
    .script-card > h2, .trace-card > h2 { margin-bottom: 20px; }
    .script-card > label { margin-bottom: 7px; }
    #script-body { margin-top: 19px; max-height: 620px; overflow-y: auto; scrollbar-color: #b8874e #f7dba4; padding-right: 4px; }
    .script-keywords { padding: 12px 14px; background: #f3ce86; border: 1px solid #cba268; }
    .script-keywords p { margin: 0; line-height: 1.65; }
    .script-keywords .small-label { margin-bottom: 5px; }
    .small-label { font-size: .875rem; font-weight: 700; color: #80522d; margin: 0 0 8px; }
    .outer-if { margin: 17px 0 14px; font-size: .9375rem; line-height: 1.7; }
    .syntax { color: #975027; font-weight: 700; white-space: nowrap; }
    .script-rules { border-left: 3px solid #cea668; padding-left: 13px; }
    .script-rule { border: 1px solid #d5b47b; background: #fff1cd; padding: 13px; margin-bottom: 13px; }
    .active-rule { border: 2px solid #9ca95a; padding: 12px; background: #fff7dc; }
    .script-rule-heading, .trace-rule-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .script-rule h3, .trace-rule-heading h3 { margin: 0; font-size: 1rem; }
    .script-rule-heading .text-button, .trace-rule-heading .text-button { padding: 0; }
    .script-line { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 10px; margin: 8px 0; line-height: 1.75; font-size: .9375rem; overflow-wrap: anywhere; }
    .named-slot { display: inline; padding: 2px 4px; background: #dde8b0; color: #56612f; border-bottom: 2px solid #8b9d4d; box-decoration-break: clone; }
    .script-actions { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-top: 18px; }
    .empty-script { color: #8b6b43; line-height: 1.7; }
    .trace-card { overflow: visible; position: sticky; top: 20px; }
    .trace-form { margin-bottom: 18px; }
    .trace-compose { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    .trace-form .primary { width: auto; margin: 0; padding-left: 10px; padding-right: 10px; }
    .trace-compose input { min-width: 0; }
    .trace-source { position: sticky; top: 8px; z-index: 1; padding: 14px; background: #fff4d6; border: 2px solid #c4a16b; box-shadow: 0 3px #ead19e; }
    .annotated-message { font-size: 1.18rem; line-height: 1.85; margin: 0; overflow-wrap: anywhere; }
    .found-keyword { text-decoration: underline; text-decoration-color: #af712d; text-decoration-thickness: 3px; text-underline-offset: 4px; font-weight: 700; }
    .found-phrase { background: #f3d695; }
    .reused-text { background: #dde8b0; color: #4e5a2e; border-bottom: 2px solid #8b9d4d; padding: 2px 0; box-decoration-break: clone; }
    .source-key { margin: 10px 0 0; font-size: .8125rem; color: #8c7149; line-height: 1.6; }
    .matched-rule { padding: 16px 0; border-bottom: 1px solid #cfa96f; }
    .rule-reason { font-size: .875rem; color: #8a673d; line-height: 1.7; margin: 0 0 13px; }
    .capture-binding { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; line-height: 1.8; margin: 14px 0; font-size: .9375rem; }
    .trace-result { padding: 18px 0 3px; }
    .built-reply { font-size: 1.13rem; line-height: 1.85; margin: 0; overflow-wrap: anywhere; }
    .trace-more { margin-top: 17px; font-size: .875rem; color: #8c7149; line-height: 1.7; }
    .trace-more summary { cursor: pointer; }
    .trace-more p { margin: 10px 0 0; }
    .rule-dialog { width: min(620px, calc(100% - 32px)); max-height: calc(100vh - 40px); overflow-y: auto; padding: 24px; border: 3px solid #84502c; border-radius: 3px; background: #ffe6ad; color: #55351f; box-shadow: inset 0 0 0 3px #f1c778, 0 4px 0 #a57442; }
    .rule-dialog::backdrop { background: #38221488; }
    .rule-dialog h2 { margin-bottom: 18px; }
    .editor-if, .editor-match, .editor-then { border: 1px solid #cba46b; padding: 14px; margin-bottom: 13px; }
    .editor-if { background: #f3ce86; }
    .editor-match { background: #fff5d9; }
    .editor-then { background: #e7edc4; }
    .editor-if > label, .editor-match > label, .editor-then > label { font-weight: 700; }
    .field-help { margin: 7px 0 0; font-size: .8125rem; line-height: 1.65; color: #8b7147; }
    .extra-field { margin-top: 13px; }
    .reply-tools { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .reply-tools .text-button { padding: 8px 0 0; }
    .editor-more { font-size: .875rem; color: #8c7149; margin: 15px 0; }
    .editor-more summary { cursor: pointer; }
    .editor-more label { margin-top: 12px; }
    .dialog-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 17px; }
    .dialog-actions .primary { width: auto; margin: 0; }
    .dialog-actions .text-button { margin-left: auto; }
    @media (max-width: 900px) { .studio-grid { grid-template-columns: 1fr; } .trace-card { position: static; } #script-body { max-height: 500px; } }
    @media (max-width: 500px) { .script-card, .trace-card { padding: 18px; } .script-line { grid-template-columns: 72px minmax(0, 1fr); gap: 8px; } .rule-dialog { padding: 19px; } .script-rules { padding-left: 9px; } }

    .script-order { font-size: .8125rem; color: #94734a; margin: -8px 0 14px; }
    .reply-or { color: #94734a; font-size: .8125rem; }
    .recorded-note { font-size: .8125rem; color: #96764b; padding: 9px 10px; background: #f7daa3; line-height: 1.6; }
    .character-words-form { margin-top: 13px; }
    .character-words-form label { margin-bottom: 6px; }
    .word-compose { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    .word-compose input { min-width: 0; }
    .word-compose .secondary { padding-left: 10px; padding-right: 10px; font-size: .875rem; }
    .memory-note { margin: 10px 0 0; color: #657138; font-size: .875rem; line-height: 1.6; }
    .memory-source { color: #8c7149; margin-top: 7px; font-size: .8125rem; line-height: 1.6; }
    .memory-source summary { cursor: pointer; }
    .memory-source p { margin: 6px 0 0; }
    .context-word { border-bottom: 2px dotted #718744; }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <h1>JC StoryMate</h1>
      </div>
    </header>

    <nav class="view-tabs" role="tablist" aria-label="StoryMate views">
      <button class="view-tab" id="chat-tab" role="tab" aria-selected="true" aria-controls="chat-panel" tabindex="0" type="button">Chat</button>
      <button class="view-tab" id="explain-tab" role="tab" aria-selected="false" aria-controls="explain-panel" tabindex="-1" type="button">Script</button>
    </nav>

    <section id="chat-panel" role="tabpanel" aria-labelledby="chat-tab">
    <div class="character-frame">
      <button class="parade-track" type="button" aria-label="Pause characters" aria-pressed="false" title="Pause characters">
        <span class="parade-party" aria-hidden="true">
          <span class="walker"><img src="assets/pixel-characters/dragon.png" alt="" width="56" height="56" draggable="false"></span>
          <span class="walker small"><img src="assets/pixel-characters/dumpling.png" alt="" width="42" height="42" draggable="false"></span>
          <span class="walker"><img src="assets/pixel-characters/angel.png" alt="" width="56" height="56" draggable="false"></span>
          <span class="walker small"><img src="assets/pixel-characters/strawberry.png" alt="" width="42" height="42" draggable="false"></span>
          <span class="walker"><img src="assets/pixel-characters/hero.png" alt="" width="56" height="56" draggable="false"></span>
          <span class="walker"><img src="assets/pixel-characters/elf.png" alt="" width="56" height="56" draggable="false"></span>
          <span class="walker small"><img src="assets/pixel-characters/cat.png" alt="" width="42" height="42" draggable="false"></span>
        </span>
      </button>
      <div class="card chat">
        <div class="chat-heading">
          <h2>Conversation</h2>
          <button class="text-button" id="clear-chat" type="button">Clear chat</button>
        </div>
        <div class="chat-log" id="chat-log" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions">
          <p class="chat-greeting">Tell me a little about your story.</p>
        </div>
        <form class="chat-form" id="chat-form">
          <label for="chat-sentence">Message</label>
          <div class="chat-compose">
            <input id="chat-sentence" placeholder="Try: A dragon." maxlength="240" autocomplete="off" spellcheck="false" aria-describedby="chat-status">
            <button class="primary" type="submit">Send</button>
          </div>
          <p class="status" id="chat-status" role="status"></p>
        </form>
      </div>
    </div>
    </section>

    <section id="explain-panel" role="tabpanel" aria-labelledby="explain-tab" hidden>
      <div class="rules-frame">
        <button class="parade-track" type="button" aria-label="Pause characters" aria-pressed="false" title="Pause characters">
        <span class="parade-party" aria-hidden="true">
          <span class="walker"><img src="assets/pixel-characters/dragon.png" alt="" width="56" height="56" draggable="false"></span>
          <span class="walker small"><img src="assets/pixel-characters/dumpling.png" alt="" width="42" height="42" draggable="false"></span>
          <span class="walker"><img src="assets/pixel-characters/angel.png" alt="" width="56" height="56" draggable="false"></span>

function characterWords(topic=config.topics.find(item=>item.number===1)) {

  $('chat-panel').hidden=!chat;
  $('explain-panel').hidden=chat;
  if (chat) $('chat-log').scrollTop=$('chat-log').scrollHeight;
}
function sendMessage() {
  try {
    const input=$('chat-sentence').value.trim();
    if (!input) throw new Error('Enter a message.');
    const result=analyze(input);commit(result);chatTurns.push(result);
    if (chatTurns.length===1) $('chat-log').innerHTML='';
    $('chat-log').insertAdjacentHTML('beforeend','<div class="chat-turn user"><p class="speaker">You</p><p class="bubble user">'+esc(input)+'</p></div><div class="chat-turn assistant"><p class="speaker">StoryMate</p><p class="bubble eliza">'+esc(result.reply)+'</p><button type="button" class="text-button message-explain" data-explain="'+(chatTurns.length-1)+'" aria-label="Explain reply '+chatTurns.length+'">Explain</button></div>');
    $('chat-sentence').value='';
    $('chat-status').textContent='';
    $('chat-sentence').removeAttribute('aria-invalid');
    $('chat-log').scrollTop=$('chat-log').scrollHeight;
    $('chat-sentence').focus();
  } catch(error) { $('chat-status').textContent=error.message;$('chat-status').classList.add('error');$('chat-sentence').setAttribute('aria-invalid','true'); }
}
function preview(selectMatched=true) {
  try {
    trace=analyze($('trace-input').value.trim());
    $('trace-status').textContent='';
    $('trace-input').removeAttribute('aria-invalid');
    if (selectMatched && trace.topic) selectedTopic=trace.topic.number;
    renderScript();renderTrace();
  } catch(error) { $('trace-status').textContent=error.message;$('trace-input').setAttribute('aria-invalid','true'); }
}
function setStatus(text,error=false) { $('rules-status').textContent=text;$('rules-status').classList.toggle('error',error); }
function saveConfig() { try {localStorage.setItem(STORAGE_KEY,JSON.stringify(config));} catch(_) {} }
function addCharacterWords() {
  try {
    const additions=$('extra-character-words').value.toLowerCase().trim().split(/[,\s]+/).filter(Boolean);
    if (!additions.length) throw new Error('Enter a character word, such as unicorn.');
    const candidate=copy(config), topic=candidate.topics.find(item=>item.number===1);
    topic.keywords=[...new Set([...topic.keywords,...additions])];
    config=validateConfig(candidate);saveConfig();renderScript();preview(false);
    setStatus('Character words added: '+additions.join(', ')+'. Try them in Chat.');
  } catch(error) { setStatus(error.message,true); }
}
function upgradeGuidance(candidate) {
  if (candidate.guidanceVersion>=1) return candidate;
  const old={
    '1.1':['What is special about [character]?','What does [character] want more than anything?'],
    '1.2':['What does the [character] want more than anything?','What is the [character] afraid of losing?'],
    '1.3':['What makes your main character interesting?'],
    '2.1':['What is unusual about the [place]?','Who else lives in the [place]?'],
    '2.2':['What makes this place different?'],
    '3.1':['What stands in the way of that goal?','What could the character lose if they fail?'],
    '4.1':['How could your character get past this obstacle?','What could make this problem even harder?'],
    '5.1':['Who else knows the secret?','What happens if the secret is revealed?'],
    '5.2':['What would make this surprise matter to your character?'],
    '6.1':['What should change for your character by the end?','What choice could bring the story to an end?']
  };
  for (const topic of candidate.topics) for (const rule of topic.rules) {
    const key=topic.number+'.'+rule.number, original=old[key];
    if (original && JSON.stringify(rule.replies)===JSON.stringify(original)) {
      const replacement=DEFAULT_CONFIG.topics.find(item=>item.number===topic.number).rules.find(item=>item.number===rule.number);
      rule.replies=copy(replacement.replies);
    }
  }
  const places=candidate.topics.find(topic=>topic.number===2);
  if (places && places.rules.some(rule=>rule.type==='place')) {
    for (const word of ['mountain','village','island']) {
      if (!candidate.topics.some(topic=>topic.keywords.includes(word))) places.keywords.push(word);
    }
  }
  if (JSON.stringify(candidate.fallback)===JSON.stringify(['What happens next?','Can you add one specific detail?','What choice does your character make?'])) candidate.fallback=copy(DEFAULT_CONFIG.fallback);
  candidate.guidanceVersion=1;
  return candidate;
}
function captureOptions(rule) {
  const name=slotName(rule);
  return [...new Set(['message','keyword',...(rule.type==='after'?[name,'before']:rule.type==='character'||rule.type==='place'?[name]:[])])];
}
function validateConfig(candidate) {
  if (!candidate || !Array.isArray(candidate.topics) || !Array.isArray(candidate.fallback) || !candidate.fallback.length) throw new Error('The saved script is incomplete.');
  const keywords=new Set(), topicNumbers=new Set();
  for (const topic of candidate.topics) {
    if (!Number.isInteger(topic.number)||topicNumbers.has(topic.number)) throw new Error('Keyword groups need different numbers.');
    topicNumbers.add(topic.number);
    topic.name=String(topic.name||'New group').trim();
    topic.keywords=[...new Set(topic.keywords.map(word=>String(word).toLowerCase().trim()).filter(Boolean))];
    if (!topic.keywords.length || topic.keywords.some(word=>!/^(?:[a-z]+(?:'[a-z]+)?|[0-9]+)$/.test(word))) throw new Error('Enter keywords as single English words, separated by commas.');
    for (const word of topic.keywords) {if (keywords.has(word)) throw new Error('"'+word+'" is already in another keyword group.');keywords.add(word);}
    topic.priority=Number(topic.priority);
    if (!Number.isInteger(topic.priority)||topic.priority<0||topic.priority>1000) throw new Error('Priority must be a whole number from 0 to 1000.');
    if (!topic.rules.length) throw new Error('A keyword group needs at least one rule.');
    const numbers=new Set();
    for (const rule of topic.rules) {
      if (!Number.isInteger(rule.number)||numbers.has(rule.number)) throw new Error('Rules in a group need different numbers.');
      numbers.add(rule.number);
      if (!MATCH_TYPES.some(item=>item[0]===rule.type)) throw new Error('Choose how the message should match.');
      rule.phrase=String(rule.phrase||'').trim().replace(/\s+/g,' ').toLowerCase();
      rule.capture=String(rule.capture||'detail').trim().toLowerCase();
      if (['after','phrase','exact'].includes(rule.type)&&!tokenize(rule.phrase).length) throw new Error(ruleId(topic,rule)+': enter the phrase to find.');
      if (!/^[a-z][a-z0-9_]*$/.test(rule.capture)||['message','keyword','before'].includes(rule.capture)) throw new Error('Name the captured text with a simple word, such as character or detail.');
      rule.replies=rule.replies.map(text=>String(text).trim()).filter(Boolean);
      if (!rule.replies.length) throw new Error(ruleId(topic,rule)+': write a reply.');
      const allowed=captureOptions(rule);
      for (const reply of rule.replies) {
        for (const part of reply.matchAll(/\[([^\[\]]*)\]/g)) if (!allowed.includes(part[1].toLowerCase())) throw new Error(ruleId(topic,rule)+': available text parts are '+allowed.map(name=>'['+name+']').join(', ')+'.');
        if (/[\[\]{}]/.test(reply.replace(/\[[a-z][a-z0-9_]*\]/gi,''))) throw new Error('Use a named text part such as [character].');
      }
    }
    topic.nextRule=Math.max(Number(topic.nextRule)||1,...topic.rules.map(rule=>rule.number+1));
  }
  candidate.nextTopic=Math.max(Number(candidate.nextTopic)||1,...candidate.topics.map(topic=>topic.number+1));
  return candidate;
}
function editorFields() {
  const rule=editState.rule;
  const needsPhrase=['after','phrase','exact'].includes(rule.type);
  $('phrase-field').hidden=!needsPhrase;
  $('capture-field').hidden=rule.type!=='after';
  $('edit-phrase').value=rule.phrase||'';
  $('edit-capture').value=rule.capture||'detail';
  $('insert-part').textContent='Insert ['+slotName(rule)+']';
  $('match-help').textContent=describe(rule);
}
function openEditor(topicNumber,number=null) {
  const topic=config.topics.find(item=>item.number===topicNumber);
  const fresh=!topic;
  const workingTopic=fresh ? {number:config.nextTopic,name:'New group',keywords:[],priority:70,nextRule:2,rules:[]} : copy(topic);
  const existing=number===null ? null : workingTopic.rules.find(rule=>rule.number===number);
  const rule=existing ? copy(existing) : defaultRule(fresh?1:workingTopic.nextRule,'keyword',['']);
  editState={topic:workingTopic,rule,isNewGroup:fresh,isNewRule:!existing};
  $('editor-title').textContent=(existing?'Edit ':'Add ')+ruleId(workingTopic,rule);
  $('edit-keywords').value=workingTopic.keywords.join(', ');
  $('keyword-help').textContent=fresh ? 'These words start a new keyword group.' : 'Shared by keyword group '+workingTopic.number+'.';
  $('edit-match').innerHTML=MATCH_TYPES.map(item=>'<option value="'+item[0]+'">'+item[1]+'</option>').join('');
  $('edit-match').value=rule.type;
  $('edit-replies').value=rule.replies.join('\n');
  $('edit-name').value=workingTopic.name;
  $('edit-priority').value=workingTopic.priority;
  $('editor-more').open=false;
  $('editor-status').textContent='';
  $('delete-rule').hidden=!existing;
  editorFields();
  $('rule-dialog').showModal();
  $(fresh?'edit-keywords':'edit-match').focus();
}
function saveEditedRule() {
  try {
    const candidate=copy(config), topic=copy(editState.topic), rule=copy(editState.rule);
    topic.keywords=$('edit-keywords').value.split(/[,\s]+/).filter(Boolean);
    topic.name=$('edit-name').value.trim()||topic.keywords[0]||'New group';
    if (editState.isNewGroup && topic.name==='New group' && topic.keywords[0]) topic.name=topic.keywords[0][0].toUpperCase()+topic.keywords[0].slice(1);
    topic.priority=Number($('edit-priority').value);
    rule.type=$('edit-match').value;rule.phrase=$('edit-phrase').value;rule.capture=$('edit-capture').value;
    rule.replies=$('edit-replies').value.split(/\r?\n/);
    if (editState.isNewRule) {
      topic.rules.unshift(rule);
      topic.nextRule=Math.max(topic.nextRule,rule.number+1);
    } else topic.rules[topic.rules.findIndex(item=>item.number===rule.number)]=rule;
    if (editState.isNewGroup) candidate.topics.push(topic);
    else candidate.topics[candidate.topics.findIndex(item=>item.number===topic.number)]=topic;
    candidate.nextTopic=Math.max(candidate.nextTopic,topic.number+1);
    config=validateConfig(candidate);cursors.clear();selectedTopic=topic.number;saveConfig();
    $('rule-dialog').close();renderScript();preview(false);
    setStatus(ruleId(topic,rule)+' saved. Try it in Chat.');
  } catch(error) { $('editor-status').textContent=error.message; }
}
function deleteEditedRule() {
  const topic=config.topics.find(item=>item.number===editState.topic.number);
  topic.rules=topic.rules.filter(rule=>rule.number!==editState.rule.number);
  if (!topic.rules.length) config.topics=config.topics.filter(item=>item!==topic);
  cursors.clear();saveConfig();$('rule-dialog').close();renderScript();preview();setStatus('Rule removed.');
}
function importLegacy(saved) {
  let migrated=copy(DEFAULT_CONFIG);
  migrated.topics=saved.rules.map((group,index)=>({
    number:index+1,name:DEFAULT_CONFIG.topics[index] ? DEFAULT_CONFIG.topics[index].name : (group.keywords[0]||'New group'),
    keywords:group.keywords,priority:group.rank,nextRule:group.patterns.length+1,
    rules:group.patterns.map((pattern,pi)=>{
      const words=pattern.tokens;
      let type='keyword', phrase='', capture=index===0?'character':'detail', replacements={};
      if (words.length===1 && words[0]==='*') replacements[1]='[message]';
      else if (words.join(' ')==='* @character *' || words.join(' ')==='* @place *') {
        type=words[1].slice(1);replacements[2]='['+type+']';
      } else if (words[0]==='*' && words[words.length-1]==='*' && words.slice(1,-1).every(word=>word!=='*'&&!word.startsWith('@'))) {
        const usesTail=pattern.replies.some(reply=>reply.includes('{'+words.length+'}'));
        type=usesTail?'after':'phrase';phrase=words.slice(1,-1).join(' ');
        replacements[1]='[before]';replacements[words.length]='['+capture+']';
        words.forEach((word,wi)=>{if (word!=='*') replacements[wi+1]=word;});
      } else throw new Error('An older custom pattern needs its saved format.');
      const replies=pattern.replies.map(reply=>reply.replace(/\{([0-9]+)\}/g,(_,n)=>{
        if (!(n in replacements)) throw new Error('An older capture needs its saved format.');
        return replacements[n];
      }));
      return defaultRule(pi+1,type,replies,phrase,capture);
    })
  }));
  migrated.nextTopic=migrated.topics.length+1;
  migrated.fallback=saved.fallback.replies;
  migrated.guidanceVersion=0;
  return validateConfig(migrated);
}
function initialize() {
  try {
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved) config=validateConfig(saved);
    else {
      const older=JSON.parse(localStorage.getItem(LEGACY_KEY));
      if (older) config=importLegacy(older);
    }
  } catch(_) {config=copy(DEFAULT_CONFIG);}
  config=validateConfig(upgradeGuidance(config));saveConfig();
  $('chat-log').innerHTML='<p class="chat-greeting">'+esc(OPENING)+'</p>';
  renderScript();preview();
  document.querySelectorAll('.parade-track').forEach(track=>track.addEventListener('click',()=>{
    const paused=track.classList.toggle('is-paused');track.setAttribute('aria-pressed',String(paused));
    track.setAttribute('aria-label',paused?'Resume characters':'Pause characters');track.title=paused?'Resume characters':'Pause characters';
  }));
  $('chat-tab').addEventListener('click',()=>selectView('chat'));
  $('explain-tab').addEventListener('click',()=>selectView('rules'));
  document.querySelector('[role="tablist"]').addEventListener('keydown',event=>{
    if (!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
    event.preventDefault();
    const chat=event.key==='Home'||(event.key!=='End'&&$('chat-tab').getAttribute('aria-selected')!=='true');
    selectView(chat?'chat':'rules');$(chat?'chat-tab':'explain-tab').focus();
  });
  $('chat-form').addEventListener('submit',event=>{event.preventDefault();sendMessage();});
  $('chat-log').addEventListener('click',event=>{
    const button=event.target.closest('[data-explain]');if (!button) return;
    trace=chatTurns[Number(button.dataset.explain)];$('trace-input').value=trace.input;
    if (trace.topic && config.topics.some(topic=>topic.number===trace.topic.number)) selectedTopic=trace.topic.number;
    $('trace-status').textContent='';renderScript();renderTrace();selectView('rules');
    $('explanation').scrollIntoView({block:'start'});$('explanation').focus({preventScroll:true});
  });
  $('clear-chat').addEventListener('click',()=>{
    chatTurns.length=0;cursors.clear();storyMemory.character=null;$('chat-log').innerHTML='<p class="chat-greeting">'+esc(OPENING)+'</p>';
    $('chat-status').textContent='';$('chat-sentence').value='';$('chat-sentence').removeAttribute('aria-invalid');$('chat-sentence').focus();
  });
  $('trace-form').addEventListener('submit',event=>{event.preventDefault();preview();});
  $('topic-select').addEventListener('change',()=>{
    if ($('topic-select').value==='new') {renderScript();openEditor(null);return;}
    selectedTopic=Number($('topic-select').value);renderScript();
  });
  $('script-body').addEventListener('click',event=>{const button=event.target.closest('[data-edit]');if (button) openEditor(selectedTopic,Number(button.dataset.edit));});
  $('script-body').addEventListener('submit',event=>{if (event.target.id==='character-words-form') {event.preventDefault();addCharacterWords();}});
  $('add-rule').addEventListener('click',()=>openEditor(selectedTopic));
  $('restore-defaults').addEventListener('click',()=>{config=copy(DEFAULT_CONFIG);cursors.clear();selectedTopic=1;saveConfig();renderScript();preview();setStatus('Default script restored.');});
  $('rule-editor').addEventListener('submit',event=>{event.preventDefault();saveEditedRule();});
  $('cancel-editor').addEventListener('click',()=>$('rule-dialog').close());
  $('delete-rule').addEventListener('click',deleteEditedRule);
  $('edit-match').addEventListener('change',()=>{editState.rule.type=$('edit-match').value;editorFields();});
  $('edit-phrase').addEventListener('input',()=>{editState.rule.phrase=$('edit-phrase').value;$('match-help').textContent=describe(editState.rule);});
  $('edit-capture').addEventListener('input',()=>{editState.rule.capture=$('edit-capture').value;$('insert-part').textContent='Insert ['+slotName(editState.rule)+']';});
  $('insert-part').addEventListener('click',()=>{
    const field=$('edit-replies'), text='['+slotName(editState.rule)+']', start=field.selectionStart, end=field.selectionEnd;
    field.value=field.value.slice(0,start)+text+field.value.slice(end);field.focus();field.setSelectionRange(start+text.length,start+text.length);
  });
}
initialize();
  </script>
